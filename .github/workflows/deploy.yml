name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

  schedule:
    # Monday + Thursday at 22:00 Sri Lanka time (16:30 UTC)
    - cron: "30 16 * * 1,4"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Quartz
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git info for note dates

      # The vault is private. REPO_KEY is a PAT with read access to
      # nmdra/Second-Brain; without it CI has no source to publish from, so
      # fail before checkout produces its own opaque error.
      - name: Check vault credentials
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: |
          if [ -z "$REPO_KEY" ]; then
            echo "::error::REPO_KEY is not set — CI cannot read nmdra/Second-Brain"
            exit 1
          fi

      - name: Check out vault
        uses: actions/checkout@v6
        with:
          repository: nmdra/Second-Brain
          token: ${{ secrets.REPO_KEY }}
          path: vault
          fetch-depth: 1
          persist-credentials: false # never leave the token in .git/config

      # content/ is written here, not trusted from the push: sync-content.py
      # copies only what publish.list allows and only allowlisted extensions.
      - name: Sync published notes
        run: ./scripts/sync-content.py --vault vault

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Local plugin sources (./quartz/plugins/*) resolve through
      # .quartz/plugins symlinks that are gitignored; without this the build
      # silently drops them (graph-local, link-notice). Same step as the
      # package.json prebuild hook, which `npx quartz build` does not fire.
      - name: Link local plugins
        run: npm run install-plugins

      # Layer 4 of the copyright guard: nothing document-shaped may ever be in
      # content/. scripts/sync-content.py is the only writer of content/ and
      # already refuses these extensions — this fails the build if that ever
      # regresses. Runs after the sync above, so it checks what CI produced.
      - name: Check blocked files
        run: |
          set -euo pipefail

          blocked_extensions=(
            pdf
            epub
            docx
            pptx
            xlsx
            canvas
            base
          )

          check_directory() {
            local directory="$1"
            local bad=""

            for ext in "${blocked_extensions[@]}"; do
              bad+=$(find "$directory" -type f -iname "*.${ext}" -print)
            done

            if [ -n "$bad" ]; then
              echo "::error::Blocked files found in $directory"
              echo "$bad"
              exit 1
            fi

            echo "$directory clean"
          }

          check_directory content

      - name: Build Quartz
        run: |
          set -euo pipefail
          npx quartz build 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Quartz exits 0 even when it globs nothing, so every gate below stays
      # green and an empty site ships. That has happened once (content/ was
      # git-ignored, and the globber honours .gitignore). Refuse it here.
      - name: Validate build
        run: |
          set -euo pipefail

          if grep -qE "Found 0 input files|Parsed 0 Markdown files" "$RUNNER_TEMP/build.log"; then
            echo "::error::Quartz parsed no notes — refusing to deploy"
            grep -E "Found|Parsed|Emitted" "$RUNNER_TEMP/build.log" || true
            exit 1
          fi

          if ! grep -qE "Parsed [1-9][0-9]* Markdown files" "$RUNNER_TEMP/build.log"; then
            echo "::error::Could not confirm that Quartz parsed Markdown files"
            exit 1
          fi

          public_files=$(find public -type f | wc -l)

          if [ "$public_files" -eq 0 ]; then
            echo "::error::public/ is empty — refusing to deploy"
            exit 1
          fi

          echo "Build validated: $public_files generated files"

      # Local plugins load silently-but-fully when their .quartz symlinks are
      # missing: the build stays green and the component just vanishes from
      # the site. Probe the emitted bundle for both local plugins.
      - name: Local-plugin gate
        run: |
          set -euo pipefail
          if ! grep -rq "hasn't been published" public --include="*.js"; then
            echo "::error::link-notice script missing from bundle — local plugin not loaded"
            exit 1
          fi
          if ! grep -rq "Graph View" public --include="*.html"; then
            echo "::error::graph component missing from pages — local plugin not loaded"
            exit 1
          fi
          echo "local plugins present"

      # Same gate on the emitted site: catches anything a Quartz upgrade or a
      # config change might start copying despite ignorePatterns.
      - name: Check generated site
        run: |
          set -euo pipefail

          blocked_extensions=(
            pdf
            epub
            docx
            pptx
            xlsx
            canvas
            base
          )

          bad=""

          for ext in "${blocked_extensions[@]}"; do
            bad+=$(find public -type f -iname "*.${ext}" -print)
          done

          if [ -n "$bad" ]; then
            echo "::error::Blocked files found in public/"
            echo "$bad"
            exit 1
          fi

          echo "public/ clean"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
