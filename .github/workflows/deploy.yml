name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git info for note dates

      # The vault is private. REPO_KEY is a PAT with read access to
      # nmdra/Second-Brain; without it CI has no source to publish from, so
      # fail before checkout produces its own opaque error.
      - name: Check vault credentials
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: |
          if [ -z "$REPO_KEY" ]; then
            echo "::error::REPO_KEY is not set on this repository — CI cannot read nmdra/Second-Brain"
            exit 1
          fi
          echo "REPO_KEY present"

      - name: Check out the vault
        uses: actions/checkout@v6
        with:
          repository: nmdra/Second-Brain
          token: ${{ secrets.REPO_KEY }}
          path: vault
          fetch-depth: 1
          persist-credentials: false # never leave the token in .git/config

      # content/ is written here, not trusted from the push: sync-content.py
      # copies only what publish.list allows and only allowlisted extensions.
      - name: Sync published notes from the vault
        run: ./scripts/sync-content.py --vault vault

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      # Layer 4 of the copyright guard: nothing document-shaped may ever be in
      # content/. scripts/sync-content.py is the only writer of content/ and
      # already refuses these extensions — this fails the build if that ever
      # regresses. Runs after the sync above, so it checks what CI produced.
      - name: Copyright gate — content/
        run: |
          set -euo pipefail
          blocked='\(*.pdf\) -o \(*.epub\) -o \(*.docx\) -o \(*.pptx\) -o \(*.xlsx\) -o \(*.canvas\) -o \(*.base\)'
          bad=$(find content -type f \( -iname '*.pdf' -o -iname '*.epub' -o -iname '*.docx' \
                -o -iname '*.pptx' -o -iname '*.xlsx' -o -iname '*.canvas' -o -iname '*.base' \) || true)
          if [ -n "$bad" ]; then
            echo "::error::Blocked files found in content/ — these must never be published"
            echo "$bad"
            exit 1
          fi
          echo "content/ clean"

      - name: Build Quartz
        run: npx quartz build

      # Same gate on the emitted site: catches anything a Quartz upgrade or a
      # config change might start copying despite ignorePatterns.
      - name: Copyright gate — public/
        run: |
          set -euo pipefail
          bad=$(find public -type f \( -iname '*.pdf' -o -iname '*.epub' -o -iname '*.docx' \
                -o -iname '*.pptx' -o -iname '*.xlsx' \) || true)
          if [ -n "$bad" ]; then
            echo "::error::Blocked files found in public/ — deployment aborted"
            echo "$bad"
            exit 1
          fi
          echo "public/ clean"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
